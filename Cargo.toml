[package]
name = "geditor"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal code editor with file explorer, syntax colors, minimap, AI chat, and an integrated shell"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gromilicx/Geditor"
homepage = "https://github.com/gromilicx/Geditor"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30.2"
tui-textarea = { package = "tui-textarea-2", version = "0.13.2", features = ["search"] }
syntect = "5.2"
portable-pty = "0.9"
vt100 = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
walkdir = "2"
regex = "1"

serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ignore = "0.4"
globset = "0.4"
unicode-width = "0.2"

pulldown-cmark = { version = "0.13", default-features = false }
